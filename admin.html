<!doctype html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hantiye Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f8;color:#172033}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001;margin-bottom:20px}h1{color:#0d5c63;margin-top:0}.muted{color:#667085}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;margin:7px 0 14px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;background:#0d5c63;color:#fff;margin:3px}.secondary{background:#667085}.danger{background:#c62828}.hidden{display:none}.msg{margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef6f7;white-space:pre-wrap}.error{background:#fff0f0;color:#a61b1b}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.file{border:1px solid #e4e7ec;border-radius:14px;padding:12px}.file img,.file video{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#eef2f5}.file-name{font-size:13px;word-break:break-all;margin:8px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}@media(max-width:600px){.wrap{margin:15px auto;padding:12px}}</style></head>
<body><div class="wrap"><div class="card" id="loginCard"><h1>Hantiye Admin</h1><p class="muted">Maamulka sawirrada iyo videos-ka Hantiye Home Moving.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Gal Admin</button><button class="secondary" id="testBtn">Tijaabi Connection</button><div id="loginMsg"></div></div><div class="card hidden" id="adminCard"><div class="top"><div><h1>Media Admin</h1><div class="muted" id="who"></div></div><button class="secondary" id="logoutBtn">Ka bax</button></div><hr><h2>Ku dar sawir ama video</h2><input id="mediaFile" type="file" accept="image/*,video/*"><button id="uploadBtn">Upload</button><div id="uploadMsg"></div><h2>Media ku jira Supabase</h2><button class="secondary" id="refreshBtn">Refresh</button><div id="files" class="files"></div></div></div>
<script>
const KEY='sb_publishable_36GJmYiIsbRzgow7CbpQoQ_uhm7bxgB', BUCKET='hantiye-media', API=location.origin+'/sb';
const $=id=>document.getElementById(id); const set=(el,t,e=false)=>{el.textContent=t;el.className='msg'+(e?' error':'')};
async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',KEY);if(!h.has('Authorization')&&sessionStorage.token)h.set('Authorization','Bearer '+sessionStorage.token);if(opt.body instanceof File){h.set('Content-Type',opt.body.type||'application/octet-stream');}else if(opt.body&&typeof opt.body==='string')h.set('Content-Type','application/json');const r=await fetch(API+path,{...opt,headers:h});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}return {r,text,data};}
async function test(){set($('loginMsg'),'Connection-ka waa la tijaabinayaa...');try{const r=await fetch(location.origin+'/sb-health',{cache:'no-store'});const t=await r.text();if(!r.ok||!t.includes('"proxy":true')){set($('loginMsg'),'Cloudflare proxy-ga lama shaqeynayo. Deploy-kan ma fulinayo _worker.js.',true);return}set($('loginMsg'),'Cloudflare proxy-ga waa OK. Hadda Gal Admin samee.');}catch(e){set($('loginMsg'),'Connection error: '+e.message,true)}}
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){set($('loginMsg'),'Email iyo password geli.',true);return}set($('loginMsg'),'Login...');try{const {r,text,data}=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!r.ok||!data?.access_token){set($('loginMsg'),'Login error HTTP '+r.status+'\n'+(text||'Jawaab madhan'),true);return}sessionStorage.token=data.access_token;sessionStorage.refresh=data.refresh_token||'';sessionStorage.email=email;showAdmin();await refresh();}catch(e){set($('loginMsg'),'Login error: '+e.message,true)}}
function showAdmin(){$('loginCard').classList.add('hidden');$('adminCard').classList.remove('hidden');$('who').textContent=sessionStorage.email||''}
async function refresh(){const box=$('files');box.innerHTML='Loading...';try{const {r,text,data}=await api('/storage/v1/object/list/'+BUCKET,{method:'POST',body:JSON.stringify({prefix:'',limit:100,offset:0,sortBy:{column:'created_at',order:'desc'}})});if(!r.ok){box.innerHTML='';set($('uploadMsg'),'List error HTTP '+r.status+'\n'+text,true);return}box.innerHTML='';for(const f of (data||[])){if(!f.name)continue;const url=API+'/storage/v1/object/public/'+BUCKET+'/'+encodeURIComponent(f.name).replace(/%2F/g,'/');const v=/\.(mp4|webm|mov|m4v|ogg)$/i.test(f.name);const d=document.createElement('div');d.className='file';d.innerHTML=(v?`<video controls src="${url}"></video>`:`<img src="${url}" alt="Hantiye">`)+`<div class="file-name">${f.name.replace(/</g,'&lt;')}</div><button class="danger">Delete</button>`;d.querySelector('button').onclick=()=>del(f.name);box.appendChild(d)}}catch(e){box.innerHTML='';set($('uploadMsg'),'Refresh error: '+e.message,true)}}
async function del(name){if(!confirm('Ma tirtirtaa '+name+'?'))return;const {r,text}=await api('/storage/v1/object/'+BUCKET,{method:'DELETE',body:JSON.stringify({prefix:'',objects:[name]})});if(!r.ok){set($('uploadMsg'),'Delete error HTTP '+r.status+'\n'+text,true);return}set($('uploadMsg'),'Waa la tirtiray.');refresh()}
async function upload(){const f=$('mediaFile').files[0];if(!f){set($('uploadMsg'),'Marka hore dooro file.',true);return}if(f.size>50*1024*1024){set($('uploadMsg'),'File-ku waa ka weyn yahay 50MB.',true);return}const path=Date.now()+'-'+crypto.randomUUID().slice(0,8)+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'-');set($('uploadMsg'),'Uploading...');try{const {r,text}=await api('/storage/v1/object/'+BUCKET+'/'+encodeURIComponent(path),{method:'POST',body:f});if(!r.ok){set($('uploadMsg'),'Upload error HTTP '+r.status+'\n'+text,true);return}$('mediaFile').value='';set($('uploadMsg'),'Upload waa guuleystay.');refresh()}catch(e){set($('uploadMsg'),'Upload error: '+e.message,true)}}
$('testBtn').onclick=test;$('loginBtn').onclick=login;$('uploadBtn').onclick=upload;$('refreshBtn').onclick=refresh;$('logoutBtn').onclick=()=>{sessionStorage.clear();location.reload()};
if(sessionStorage.token){showAdmin();refresh()}
</script></body></html>
